# Seeded from the table built into gangmu cbom. Same key = replaces that built-in entry.
algorithms:
- key: aes
  name: AES
  primitive: block-cipher
  quantum: symmetric
  patterns:
  - mbedtls_aes_
  - esp_aes_
  - wc_Aes
  - tc_aes_
  - HAL_CRYP
  - AES_(?:set_)?(?:en|de)crypt_key
  - AES_(?:encrypt|decrypt|ecb_encrypt|cbc_encrypt|ctr128_encrypt)\b
  - MBEDTLS_AES_C\b
  - CONFIG_MBEDTLS_AES\w*
  - CONFIG_CRYPTO_AES\w*
  - PSA_KEY_TYPE_AES\b
  - br_aes_\w+
  - tc_aes\d+_\w+
  - rijndael_(?:setup|ecb_encrypt|ecb_decrypt)\b
  - EVP_aes_\d+_(?:cbc|ecb|ctr|cfb\w*|ofb)\b
  - atcab_aes_(?:cbc|ctr|encrypt|decrypt)\w*
  - CRYPTO_CIPHER_ALGO_AES\b
  - aes_expandkey\b
  - crypto_aes_set_key\b
  - aes(?:128|192|256)-(?:ctr|cbc)\b
  - TPM2?_ALG_AES\b
  note: A 128-bit key leaves about 64 bits of quantum security; 256-bit keys are the usual advice.
- key: des
  name: DES/3DES
  primitive: block-cipher
  quantum: broken
  patterns:
  - mbedtls_des3?_
  - DES_(?:ecb|cbc|ede3|set_key)\w*
  - wc_Des3?_\w+
  - MBEDTLS_DES_C\b
  - CONFIG_MBEDTLS_DES_C\b
  - br_des_\w+
  - des3?_(?:setup|ecb_encrypt|ecb_decrypt)\b
  - EVP_des_\w+
  - (?:MBEDTLS_|BR_)?TLS_\w+_WITH_3DES_EDE_CBC_\w+
  - CRYP_T?DES_\w+
  - 3des-cbc\b
  note: DES and 3DES are legacy; avoid them in new designs.
- key: rc4
  name: RC4
  primitive: stream-cipher
  quantum: broken
  patterns:
  - mbedtls_arc4_
  - RC4_set_key
  - RC4\(
  - wc_Arc4\w*
  - MBEDTLS_ARC4_C\b
  - (?:MBEDTLS_|BR_)?TLS_\w+_WITH_RC4_\w+
  - arc4_(?:setkey|crypt)\b
  note: RC4 has practical attacks; remove it.
- key: chacha20-poly1305
  name: ChaCha20-Poly1305
  primitive: ae
  quantum: symmetric
  patterns:
  - mbedtls_chacha20\w*
  - mbedtls_poly1305\w*
  - wc_Chacha\w*
  - wc_Poly1305\w*
  - EVP_chacha20\w*
  - MBEDTLS_CHACHA20_C\b
  - MBEDTLS_CHACHAPOLY_C\b
  - crypto_aead_chacha20poly1305\w*
  - crypto_chacha20\w*
  - crypto_stream_chacha20\w*
  - br_chacha20_\w+
  - chacha20poly1305_\w+
  - chacha_(?:setup|crypt)\b
  - chacha20-poly1305@openssh\.com
  note: A 256-bit key.
- key: sm4
  name: SM4
  primitive: block-cipher
  quantum: symmetric
  patterns:
  - sm4_(?:setkey|crypt|encrypt|decrypt|set_key)\w*
  - SM4_(?:set_key|encrypt|decrypt|CTX)\w*
  - mbedtls_sm4_\w+
  - EVP_sm4_\w+
  - TPM2?_ALG_SM4\b
  note: Chinese national block cipher (128-bit key).
