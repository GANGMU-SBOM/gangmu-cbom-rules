[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gangmu-cbom-rules"
version = "2026.10.9"
description = "Free CBOM rule base for gangmu: the cryptographic algorithms gangmu cbom looks for, as data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CDLA-Permissive-2.0 (rules); Apache-2.0 (packaging code)" }
keywords = ["cbom", "cryptography", "post-quantum", "pqc", "cyclonedx", "embedded", "gangmu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/GANGMU-SBOM/gangmu-cbom-rules"
Tool = "https://github.com/GANGMU-SBOM/gangmu"
Issues = "https://github.com/GANGMU-SBOM/gangmu-cbom-rules/issues"

[project.entry-points."gangmu.rule_packs"]
cbom = "gangmu_cbom_rules:path"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "gangmu-sbom @ git+https://github.com/GANGMU-SBOM/gangmu@main"]
